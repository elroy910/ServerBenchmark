[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
sha2 = { version = "=0.10.8", features = ["force-soft"] }
libc = "=0.2.170"
clap = { version = "=4.5.31", features = ["derive"] }
miniz_oxide = "=0.8.5"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
